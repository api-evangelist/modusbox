aid: modusbox
name: ModusBox
description: 'ModusBox now operates as PortX, Inc. — modusbox.com 301s to portx.io. PortX
  is an AI-native integration platform (iPaaS) purpose-built for community banks, credit
  unions and fintechs. The PortX Platform spans Integration Manager (core, fintech and
  enterprise API integration), Data Manager (a governed real-time data lakehouse powering
  Customer 360), Payment Manager (ACH, wire, RTP and FedNow payment orchestration) and
  PiXi AI as the embedded intelligence layer. Its ORCA (Open Reusable Core API)
  specification is an ISO 20022-aligned JSON/REST contract for connecting to major US
  banking cores including Symitar, Fiserv Premier, Finastra Phoenix and Corelation
  KeyStone. PortX is SOC 2 Type II and ISO/IEC 27001 certified and aligns to FAPI, FDX,
  ISO 20022, CUFX and PCI.'
