apis:
- name: PortX ORCA (Open Reusable Core API)
  description: 'ORCA is PortX''s universal, standards-based REST contract for US banking
    core connectivity — an ISO 20022-aligned JSON/REST specification covering bank account
    opening, maintenance, closing and reporting, plus parties, transactions, cards,
    loans, collaterals, ledger accounts, internal transfers and credit transfers. The
    published OpenAPI 3.1.0 description carries 112 operations across 16 tags. ORCA is
    deployed as a per-institution connector (for example a symitar-orca or fco-premier-orca
    instance), so the contract''s servers block is templated rather than naming one shared
    host. Access to the specification is governed by the ORCA Evaluation and Access License.'
  humanURL: https://orca-docs.portx.io/
  baseURL: https://api.portx.io/orca/v1
  x-base-url-note: 'Base URL as documented by PortX at https://orca-docs.portx.io/docs/getting-started/.
    Probed 2026-08-26: api.portx.io does not resolve (NXDOMAIN), and the published OpenAPI
    servers block is templated (https://{host}, "ORCA-compliant connector deployment"),
    so real traffic goes to a per-institution connector host issued by PortX rather than
    to a shared public gateway.'
