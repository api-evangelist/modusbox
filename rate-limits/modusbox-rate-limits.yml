note: >-
  PortX publishes no rate limits for ORCA. The documentation has no rate-limit, quota or
  throttling section; no RateLimit-*, X-RateLimit-* or Retry-After header is declared
  anywhere in the published contract; and no 429 response is defined on any of the 112
  operations. This is an honest zero, not an unchecked field. It is also consistent with
  the deployment model — ORCA runs as a per-institution connector in front of that
  institution's own banking core, so practical throughput is governed by the core and by
  the commercial agreement rather than by a published public tier. The consequence for an
  agent is real: there is no runtime signal telling it to back off, and no documented
  status code telling it that it has been throttled.

