# ---------------------------------------------------------------------------
# DOMAIN STANDARD SIGNATURE (0.12.0 domain_standard_conformance)
# ---------------------------------------------------------------------------
domain_standard:
  id: iso20022
  name: ISO 20022
  conforms: true
  sector: banking
  evidence:
    contract_location: info.description of the published ORCA OpenAPI 3.1.0 description
    contract_url: https://orca-docs.portx.io/specs/accounts-api-0.16.3.yaml
    claim: >-
      The contract opens by declaring that ORCA semantics and interaction are based on
      ISO 20022 and restricted to the US banking domain, scoping the covered flows to
      bank account opening, maintenance, closing and reporting, and noting that every
      ORCA request message carries an attribute supporting the ISO 20022 digital
      signature.
    corroboration:
    - url: https://portx.io/llms.txt
      status: 200
      claim: PortX "aligns to FAPI, FDX, ISO 20022, CUFX, and PCI standards".
    - url: https://portx.io/print/orca-onepager
      status: 200
      claim: >-
        ORCA described as a universal, portable, standards-based API specification
        (JSON/REST, aligned with ISO 20022, CUFX, FDX).
  note: >-
    This is a genuine domain-standard declaration in the contract itself, not a marketing
    claim bolted on afterwards — an integrator who already speaks ISO 20022 can map ORCA
    payloads without a bespoke connector. ORCA is a REST/JSON projection of ISO 20022
    semantics rather than ISO 20022 XML message transport, so it is standard-ALIGNED at
    the data-model level rather than a wire-level ISO 20022 implementation.

