# ---------------------------------------------------------------------------
# STANDARDS ALIGNMENT — protocol and sector standards claimed by PortX
# ---------------------------------------------------------------------------
standards:
- id: fapi
  name: FAPI (Financial-grade API)
  conforms: claimed
  evidence:
    url: https://portx.io/about-us/trust
    status: 200
    claim: FAPI named alongside SOC 2 and ISO 27001 as a maintained standard.
  verification_note: >-
    Not verifiable from the published contract. FAPI requires specific OAuth 2.0 /
    OpenID Connect profile behaviour (PAR, JARM or signed request objects, sender-
    constrained tokens via mTLS or DPoP). The ORCA description declares only a generic
    http/bearer JWT scheme and an openIdConnect scheme, and its openIdConnectUrl points
    at a localhost Keycloak realm placeholder, so no FAPI profile behaviour is asserted
    in the contract. Confirming this needs an authenticated deployment.
- id: fdx
  name: FDX (Financial Data Exchange)
  conforms: claimed
  evidence:
    url: https://portx.io/llms.txt
    status: 200
    claim: FDX listed among the standards PortX aligns to; also named on the ORCA one-pager.
  verification_note: >-
    No FDX-shaped surface (no /fdx/ path family, no FDX resource naming) appears in the
    published ORCA description. PortX blogs about CFPB 1033 and FDX readiness, so this
    reads as strategic alignment rather than a shipped FDX API.
- id: cufx
  name: CUFX (Credit Union Financial Exchange)
  conforms: claimed
  evidence:
    url: https://portx.io/llms.txt
    status: 200
    claim: CUFX listed among the standards ORCA aligns to.
  verification_note: >-
    Plausible given the credit-union focus and the Symitar/Corelation core connectors,
    but no CUFX message or schema naming is present in the published ORCA description.
- id: oidc
  name: OpenID Connect
  conforms: true
  evidence:
    contract_location: components.securitySchemes.openIdConnect of the ORCA description
    claim: >-
      An openIdConnect security scheme is declared as one of the two top-level security
      options. Its openIdConnectUrl is a localhost Keycloak placeholder
      (http://localhost:8083/auth/realms/openbanking/.well-known/openid-configuration),
      consistent with per-institution connector deployment where each customer supplies
      its own issuer.
- id: oauth2
  name: OAuth 2.0
  conforms: true
  evidence:
    url: https://orca-docs.portx.io/docs/getting-started/
    status: 200
    claim: >-
      Getting Started documents a client_credentials grant exchanged at a token endpoint
      for a bearer access token.
- id: rfc9457
  name: RFC 9457 Problem Details
  conforms: false
  evidence:
    claim: >-
      Errors use a bespoke JSON envelope (code, message, details[], innerError,
      debugMessage) served as application/json. No application/problem+json media type
      and no RFC 9457 members (type, title, status, detail, instance) appear anywhere in
      the published description.
- id: pagination
  name: Cursor pagination
  conforms: true
  evidence:
    contract_location: components.parameters (pageCursor, pageLimit, pageFirstCursor, pageTotal)
    claim: >-
      Opaque-cursor pagination declared as reusable parameters — `cursor` and `limit`
      (1-100) on the request, `Pagination-Cursor` and `Pagination-Total` on the response.
- id: idempotency
  name: Idempotency keys
  conforms: true
  evidence:
    contract_location: components.parameters.idempotencyId
    claim: >-
      An `idempotencyId` request header is declared as a reusable parameter and applied
      to all 27 POST operations in the description. See conventions/.
- id: rate-limit-headers
  name: RateLimit header fields
  conforms: false
  evidence:
    claim: >-
      No RateLimit-*, X-RateLimit-* or Retry-After header is declared anywhere in the
      published description, and no 429 response is defined on any operation.

regimes:
  sector: banking
  applicable:
  - US banking / core processing
  - CFPB 1033 open banking (prospective, via FDX alignment)
  note: >-
    PortX operates as a technology provider to regulated financial institutions rather
    than as a regulated institution itself; ORCA connects to bank cores under each
    institution's own regulatory perimeter.

