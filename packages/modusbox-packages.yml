summary: >-
  There is NO client library for the ORCA API. PortX publishes no SDK for it in any
  registry, and neither the ORCA documentation nor portx.io/llms.txt has an SDK or
  downloads section — the documented integration path is raw HTTPS with a bearer JWT.
  The packages below are genuine first-party ModusBox/PortX publications found under the
  @modusbox and @pm4ml npm scopes, but they belong to the company's earlier Mojaloop and
  front-end tooling era, not to ORCA. Every @modusbox package is abandoned: the newest
  was published 2021-11-23, roughly five years before ORCA 0.16.3. Recorded here as an
  accurate account of what the company ships, not as ORCA SDKs.

